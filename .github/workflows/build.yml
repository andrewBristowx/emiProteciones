name: Build EmiProtecciones

on:
  push:
    branches:
      - main
      - "agent/**"
      - "feature/**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Build
        run: gradle build --stacktrace

      - name: Upload playable jar
        uses: actions/upload-artifact@v4
        with:
          name: EmiProtecciones-0.1.0-alpha.1
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
